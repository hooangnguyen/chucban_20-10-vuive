<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#070615">
    <title>Chúc mừng 20/10</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Dancing+Script:wght@600&display=swap&subset=vietnamese">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <canvas id="scene"></canvas>
    <div class="vignette"></div>
    <div class="fade-in"></div>

    <!-- Thiệp chúc mừng 20/10 -->
    <section class="card" id="card" hidden aria-label="Thiệp chúc mừng 20/10">
        <button class="card-close" id="card-close" aria-label="Đóng thiệp">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
        <div class="card-date">20 <span>·</span> 10</div>
        <div class="card-sub">Chúc mừng ngày Phụ nữ Việt Nam</div>
        <div class="card-to">Gửi cậu,</div>
        <!-- Lời chúc được chọn ngẫu nhiên trong index.js (danh sách WISHES) -->
        <p class="card-msg" id="card-msg"></p>
        <div class="card-sign">♡</div>
        <button class="card-next" id="card-next" aria-label="Đổi lời chúc khác" title="Đổi lời chúc khác">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 12a9 9 0 0 1 15.5-6.2L21 8" />
                <path d="M21 3v5h-5" />
                <path d="M21 12a9 9 0 0 1-15.5 6.2L3 16" />
                <path d="M3 21v-5h5" />
            </svg>
        </button>
    </section>

    <div class="controls" id="controls">
        <div class="time-panel" id="time-panel" hidden>
            <div class="time-row">
                <span class="time-label" id="time-label">--:--</span>
                <button class="chip" id="time-auto" aria-label="Theo giờ thật" title="Theo giờ thật">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 12a9 9 0 1 0 3-6.7" />
                        <path d="M3 4v4h4" />
                        <path d="M12 7v5l3 2" />
                    </svg>
                </button>
            </div>
            <input type="range" id="time-range" class="time-range" min="0" max="24" step="0.25" value="12"
                aria-label="Chọn giờ">
            <div class="time-scale" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
                <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
            </div>
        </div>

        <button id="card-toggle" class="round-btn" aria-label="Mở thiệp" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" />
            </svg>
        </button>

        <button id="clock-toggle" class="round-btn" aria-label="Chỉnh giờ" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 7v5l3 2" />
            </svg>
        </button>

        <button id="music-toggle" class="round-btn music-btn" aria-label="Bật/tắt nhạc">
            <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 18V5l11-2v13" />
                <circle cx="6" cy="18" r="3" />
                <circle cx="17" cy="16" r="3" />
            </svg>
            <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 18V5l11-2v13" />
                <circle cx="6" cy="18" r="3" />
                <circle cx="17" cy="16" r="3" />
                <path d="M3 3l18 18" />
            </svg>
        </button>
    </div>

    <script src="music.js"></script>
    <script src="index.js"></script>
</body>

</html>
